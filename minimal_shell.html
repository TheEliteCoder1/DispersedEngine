<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SDL3 WebAssembly</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* Ensure the canvas stretches correctly */
      canvas.emscripten {
        border: 0px none;
        background-color: transparent;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Emscripten looks for the 'canvas' ID by default -->
    <canvas id="canvas" class="emscripten" oncontextmenu="event.preventDefault()"></canvas>

    <!-- Emscripten Module Injection -->
    <script type='text/javascript'>
      var Module = {
        preRun: [],
        postRun: [],
        print: (function() {
          return function(text) {
            console.log(text);
          };
        })(),
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          return canvas;
        })(),
        setStatus: function(text) {},
        totalDependencies: 0,
        monitorRunDependencies: function(left) {}
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
