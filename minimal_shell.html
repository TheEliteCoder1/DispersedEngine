<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Dispersed Engine</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      
      /* Hide all Emscripten elements */
      #output,
      .emscripten,
      .emscripten_border,
      #emscripten_logo,
      #status,
      #progress,
      #controls {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
      var Module = {
        canvas: (function() {
          return document.getElementById('canvas');
        })(),
        print: (function() {
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
          };
        })(),
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
        }
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
